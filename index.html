<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私房菜单</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6b9080">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- 桌面侧栏（手机端由 CSS 隐藏） -->
  <aside class="sidebar">
    <a class="brand" data-view="home" href="#">
      <span class="brand-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 4.5C11.5 4.5 6 9 6 15.2c0 2.6 2 3.8 4.2 3.8 5.6 0 9.3-5.8 9.3-14.5Z"/><path d="M19.5 4.5C14.3 9.3 10.6 13 8.6 17.8"/></svg></span>
      <span class="brand-name">私房菜单</span>
    </a>
    <nav class="side-nav">
      <button class="nav-item active" data-view="home"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5V19a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V9.5"/><path d="M9.8 21v-6h4.4v6"/></svg></span><span class="nav-label">首页</span></button>
      <button class="nav-item" data-view="list"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.6C10.3 5 7.3 4.5 3.8 5.1v13.5c3.5-.6 6.5-.1 8.2 1.4 1.7-1.5 4.7-2 8.2-1.4V5.1C16.7 4.5 13.7 5 12 6.6Z"/><path d="M12 6.6V20"/></svg></span><span class="nav-label">菜单</span></button>
      <button class="nav-item" data-view="pick"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="3.8" width="16.4" height="16.4" rx="4"/><circle cx="8.2" cy="8.2" r="1.35" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.8" cy="15.8" r="1.35" fill="currentColor" stroke="none"/></svg></span><span class="nav-label">抽签</span></button>
      <button class="nav-item" data-view="me"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="7.8" r="3.8"/><path d="M4.8 20.6c.8-3.4 3.7-5.3 7.2-5.3s6.4 1.9 7.2 5.3"/></svg></span><span class="nav-label">我的</span></button>
    </nav>
  </aside>

  <main class="container">

    <!-- 视图 0：首页 -->
    <section id="view-home" class="view">
      <h2 id="home-greeting" class="home-greeting"></h2>

      <!-- 好好吃饭打卡 -->
      <div class="checkin-card" id="checkin">
        <div class="checkin-head">
          <h3>好好吃饭</h3>
          <span class="checkin-stats" id="checkin-stats"></span>
        </div>
        <button type="button" class="btn btn-primary checkin-btn" id="checkin-today-btn"></button>
        <div class="checkin-cal" id="checkin-cal"></div>
      </div>

      <button type="button" class="quick-pick-card" id="quick-pick-card">
        <span class="quick-emoji"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="3.8" width="16.4" height="16.4" rx="4"/><circle cx="8.2" cy="8.2" r="1.35" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.8" cy="15.8" r="1.35" fill="currentColor" stroke="none"/></svg></span>
        <span class="quick-text">
          <span class="quick-title">今天吃什么</span>
          <span class="quick-sub" id="quick-sub"></span>
        </span>
        <span class="quick-arrow">→</span>
      </button>

      <div class="seasonal" id="seasonal">
        <div class="seasonal-head">
          <h3>时令推荐</h3>
          <span class="seasonal-month" id="seasonal-month"></span>
        </div>
        <div class="carousel" id="carousel">
          <div class="carousel-track" id="carousel-track"></div>
          <div class="carousel-dots" id="carousel-dots"></div>
        </div>
      </div>
    </section>

    <!-- 视图 1：菜单列表 -->
    <section id="view-list" class="view hidden">
      <div class="search-box">
        <input type="search" id="search-input" placeholder="搜索菜名 / 标签 / 食材…">
      </div>
      <div id="category-chips" class="chips"></div>
      <div id="dish-grid" class="dish-grid"></div>
      <div id="list-empty" class="empty hidden"></div>
    </section>

    <!-- 视图 2：菜品详情 -->
    <section id="view-detail" class="view hidden">
      <div class="detail-top">
        <button class="btn btn-plain" id="btn-back">← 返回</button>
        <div class="detail-top-actions">
          <button class="btn" id="btn-edit">编辑</button>
          <button class="btn btn-danger" id="btn-delete">删除</button>
        </div>
      </div>
      <div id="detail-content"></div>
    </section>

    <!-- 视图 3：添加 / 编辑表单 -->
    <section id="view-form" class="view hidden">
      <h2 id="form-title">添加菜品</h2>
      <form id="dish-form" novalidate>
        <div class="form-group">
          <label for="f-name">菜名 <span class="required">*</span></label>
          <input type="text" id="f-name" placeholder="如：红烧肉">
        </div>

        <div class="form-group">
          <label>图片</label>
          <input type="file" id="f-image" accept="image/*" hidden>
          <div id="image-preview-box" class="image-preview-box hidden">
            <img id="image-preview" alt="菜品图片预览">
            <button type="button" class="btn btn-small btn-danger" id="btn-remove-image">移除图片</button>
          </div>
          <button type="button" class="btn btn-outline btn-small" id="btn-pick-image">选择图片</button>
          <p class="hint">图片会自动压缩（最长边 1000px），约 200~500KB</p>
        </div>

        <div class="form-group">
          <label for="f-category">分类</label>
          <input type="text" id="f-category" list="category-options" placeholder="选择已有分类，或输入新分类">
          <datalist id="category-options"></datalist>
        </div>

        <div class="form-group">
          <label>食材清单</label>
          <div class="dynamic-row">
            <input type="text" id="f-ingredient" placeholder="如：五花肉 500g（回车快速添加）">
            <button type="button" class="btn btn-small" id="btn-add-ingredient">添加</button>
          </div>
          <ul id="ingredient-list" class="item-list"></ul>
        </div>

        <div class="form-group">
          <label>做法步骤 <span class="hint-inline">（拖动手柄可排序，手机上用 ↑↓ 按钮）</span></label>
          <div class="dynamic-row">
            <input type="text" id="f-step" placeholder="如：冷水下锅焯水（回车快速添加）">
            <button type="button" class="btn btn-small" id="btn-add-step">添加</button>
          </div>
          <ol id="step-list" class="item-list step-list"></ol>
        </div>

        <div class="form-group">
          <label>标签</label>
          <div class="dynamic-row">
            <input type="text" id="f-tag" placeholder="如：下饭（回车快速添加）">
            <button type="button" class="btn btn-small" id="btn-add-tag">添加</button>
          </div>
          <div id="tag-list" class="tag-chips"></div>
        </div>

        <div class="form-group">
          <label>喜爱度</label>
          <div id="rating-picker" class="rating-picker"></div>
          <p class="hint" id="rating-hint">还没评分</p>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="btn-save">保存</button>
          <button type="button" class="btn" id="btn-cancel">取消</button>
        </div>
      </form>
    </section>

    <!-- 视图 4：今天吃什么 -->
    <section id="view-pick" class="view hidden">
      <div class="pick-mode">
        <button class="seg-btn active" data-mode="equal">等概率</button>
        <button class="seg-btn" data-mode="weighted">按喜爱度加权</button>
      </div>
      <p class="hint pick-hint">加权模式：爱心越多越容易被抽中（5 心概率是 1 心的 5 倍）</p>
      <div id="pick-category-chips" class="chips chips-center"></div>
      <button class="btn btn-primary btn-big" id="btn-pick">今天吃什么？</button>
      <p id="pick-empty-hint" class="hint pick-hint hidden"></p>
      <div id="roulette-box" class="roulette hidden"></div>
      <div id="pick-result" class="pick-result hidden"></div>
    </section>

    <!-- 视图 5：我的（设置与备份） -->
    <section id="view-me" class="view hidden">
      <div class="notice">
        ⚠️ 数据存在<b>当前设备、当前浏览器</b>里。换设备使用请先「导出备份」，再到新设备「导入备份」。
      </div>
      <div id="me-stats" class="backup-stats"></div>
      <div class="persist-row">
        <button class="btn btn-outline btn-small" id="btn-persist">申请持久化存储</button>
        <span class="hint" id="persist-hint"></span>
      </div>
      <div class="install-box">
        <button class="btn btn-primary" id="btn-install" hidden>📲 安装到桌面 / 主屏幕</button>
        <p class="hint" id="install-hint"></p>
      </div>
      <div class="backup-actions" id="me-actions">
        <button class="btn btn-primary" id="btn-export">导出备份</button>
        <button class="btn btn-outline" id="btn-import">导入备份</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </div>
      <div class="danger-zone">
        <h3>危险操作</h3>
        <p class="hint">清空后无法恢复，建议先导出备份。</p>
        <button class="btn btn-danger" id="btn-clear-all">清空全部数据</button>
      </div>
      <div class="photo-credits">
        <h3>图片致谢</h3>
        <p class="hint">内置菜品与时令照片来自 Wikimedia Commons 的免费授权作品。</p>
        <div id="photo-credits-list"></div>
      </div>
    </section>

  </main>

  <!-- 手机底部 Tab 栏（桌面端由 CSS 隐藏） -->
  <nav class="bottom-nav">
    <button class="nav-item" data-view="home"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5V19a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V9.5"/><path d="M9.8 21v-6h4.4v6"/></svg></span><span class="nav-label">首页</span></button>
    <button class="nav-item" data-view="list"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.6C10.3 5 7.3 4.5 3.8 5.1v13.5c3.5-.6 6.5-.1 8.2 1.4 1.7-1.5 4.7-2 8.2-1.4V5.1C16.7 4.5 13.7 5 12 6.6Z"/><path d="M12 6.6V20"/></svg></span><span class="nav-label">菜单</span></button>
    <button class="nav-item" data-view="pick"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="3.8" width="16.4" height="16.4" rx="4"/><circle cx="8.2" cy="8.2" r="1.35" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.8" cy="15.8" r="1.35" fill="currentColor" stroke="none"/></svg></span><span class="nav-label">抽签</span></button>
    <button class="nav-item" data-view="me"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="7.8" r="3.8"/><path d="M4.8 20.6c.8-3.4 3.7-5.3 7.2-5.3s6.4 1.9 7.2 5.3"/></svg></span><span class="nav-label">我的</span></button>
  </nav>

</div>

<!-- 浮动添加按钮（只在列表页显示） -->
<button id="fab" class="fab" title="添加菜品">＋</button>

<!-- 引入顺序很重要：后面的文件会调用前面的函数 -->
<script src="js/content.js"></script>
<script src="js/store.js"></script>
<script src="js/checkin.js"></script>
<script src="js/image.js"></script>
<script src="js/random.js"></script>
<script src="js/app.js"></script>
</body>
</html>
